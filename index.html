<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeAI</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;text-align:center;padding:25px}
.container{max-width:700px;margin:auto;padding:20px}
.card,#resume{background:white;padding:22px;border-radius:15px;margin-bottom:20px}
label{display:block;font-weight:bold;margin:15px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:90px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:17px;font-weight:bold}
#resume{display:none}
#resume h3{border-bottom:2px solid #2563eb;padding-bottom:5px}
#download{display:none;background:#059669}
  .pricing{
  max-width:700px;
  margin:25px auto;
  padding:20px;
  text-align:center;
}

.pricing > h2{
  margin-bottom:20px;
}

.plan{
  background:white;
  padding:22px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.plan h2{
  font-size:32px;
  margin:10px 0;
}

.plan p{
  margin:10px 0;
}

.plan.pro{
  border:2px solid #2563eb;
}

#upgrade{
  background:#2563eb;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>ResumeAI</h1>
<p>Create your professional resume</p>
</header>
<section class="pricing">
  <h2>Choose Your Plan</h2>

  <div class="plan">
    <h3>Free</h3>
    <h2>$0</h2>
    <p>✓ 1 AI Resume</p>
    <p>✓ AI-powered writing</p>
    <p>✓ PDF download</p>
  </div>

  <div class="plan pro">
    <h3>Pro</h3>
    <h2>$4.99</h2>
    <p>✓ More AI Resume Generations</p>
    <p>✓ Premium Resume Templates</p>
    <p>✓ PDF Downloads</p>

    <button type="button" id="upgrade">
      Upgrade to Pro
    </button>
  </div>
</section>
<div class="container">

<div class="card">
<h2>Build Your Resume</h2>

<label>Full Name</label>
<input id="name" placeholder="John Smith">

<label>Email</label>
<input id="email" placeholder="john@example.com">

<label>Phone</label>
<input id="phone" placeholder="+1 123 456 7890">

<label>Professional Summary</label>
<textarea id="summary"></textarea>

<label>Skills</label>
<textarea id="skills" placeholder="Marketing, Sales, Communication"></textarea>

<label>Work Experience</label>
<textarea id="experience"></textarea>

<label>Education</label>
<textarea id="education"></textarea>

<button id="generate">Generate Resume</button>
</div>

<div id="resume">
<h1 id="rName"></h1>
<p id="rContact"></p>

<h3>Professional Summary</h3>
<p id="rSummary"></p>

<h3>Skills</h3>
<p id="rSkills"></p>

<h3>Experience</h3>
<p id="rExperience"></p>

<h3>Education</h3>
<p id="rEducation"></p>
</div>

<button id="download">Download / Print Resume</button>

</div>

<script>
document.getElementById("generate").onclick = async function () {
  const button = document.getElementById("generate");

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const summary = document.getElementById("summary").value.trim();
  const skills = document.getElementById("skills").value.trim();
  const experience = document.getElementById("experience").value.trim();
  const education = document.getElementById("education").value.trim();

  if (!name) {
    alert("Please enter your name");
    return;
  }

  if (!summary && !skills && !experience && !education) {
    alert("Please enter some resume information first");
    return;
  }

  button.disabled = true;
  button.textContent = "Generating with AI...";

  const prompt = `
Create an ATS-friendly professional resume using ONLY the information provided below.
Do not invent employers, qualifications, education, achievements, dates, skills, or experience.

Name: ${name}
Professional Summary: ${summary}
Skills: ${skills}
Work Experience: ${experience}
Education: ${education}

Return ONLY these four sections using exactly these headings:

SUMMARY:
Write an improved professional summary.

SKILLS:
Improve and organize only the skills provided.

EXPERIENCE:
Professionally rewrite only the experience provided.

EDUCATION:
Professionally format only the education provided.
`;

  try {
    const response = await fetch(
      "https://resume-ai-chat.kx4ran44.workers.dev/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [{
            role: "user",
            content: prompt
          }]
        })
      }
    );

    if (!response.ok) {
      throw new Error("AI request failed");
    }

    if (!response.body) {
      throw new Error("No AI response");
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";
    let aiText = "";

    while (true) {
      const result = await reader.read();

      if (result.done) break;

      buffer += decoder.decode(result.value, { stream: true });

      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        const cleanLine = line.trim();

        if (!cleanLine.startsWith("data:")) continue;

        const data = cleanLine.slice(5).trim();

        if (!data || data === "[DONE]") continue;

        try {
          const parsed = JSON.parse(data);

          if (typeof parsed.response === "string") {
            aiText += parsed.response;
          }
        } catch (e) {}
      }
    }

    if (buffer.trim().startsWith("data:")) {
      const data = buffer.trim().slice(5).trim();

      if (data && data !== "[DONE]") {
        try {
          const parsed = JSON.parse(data);

          if (typeof parsed.response === "string") {
            aiText += parsed.response;
          }
        } catch (e) {}
      }
    }

    aiText = aiText.trim();

    if (!aiText) {
      throw new Error("Empty AI response");
    }

    function getSection(start, end) {
      const startIndex = aiText.indexOf(start);

      if (startIndex === -1) return "";

      const contentStart = startIndex + start.length;

      if (!end) {
        return aiText.slice(contentStart).trim();
      }

      const endIndex = aiText.indexOf(end, contentStart);

      if (endIndex === -1) {
        return aiText.slice(contentStart).trim();
      }

      return aiText.slice(contentStart, endIndex).trim();
    }

    const aiSummary =
      getSection("SUMMARY:", "SKILLS:") || summary;

    const aiSkills =
      getSection("SKILLS:", "EXPERIENCE:") || skills;

    const aiExperience =
      getSection("EXPERIENCE:", "EDUCATION:") || experience;

    const aiEducation =
      getSection("EDUCATION:", null) || education;

    document.getElementById("rName").textContent = name;

    document.getElementById("rContact").textContent =
      [email, phone].filter(Boolean).join(" | ");

    document.getElementById("rSummary").textContent = aiSummary;
    document.getElementById("rSkills").textContent = aiSkills;
    document.getElementById("rExperience").textContent = aiExperience;
    document.getElementById("rEducation").textContent = aiEducation;

    document.getElementById("resume").style.display = "block";
    document.getElementById("download").style.display = "block";

    document.getElementById("resume").scrollIntoView({
      behavior: "smooth"
    });

  } catch (error) {
    console.error(error);
    alert("AI generation failed. Please try again.");
  } finally {
    button.disabled = false;
    button.textContent = "Generate Resume";
  }
};
document.getElementById("download").onclick=function(){
window.print();
};
document.getElementById("upgrade").onclick = function () {
  const upiId = "Your upi id ";
  const amount = "399";
  const name = "ResumeAI Pro";

  const upiLink =
    "upi://pay?pa=" + encodeURIComponent(upiId) +
    "&pn=" + encodeURIComponent(name) +
    "&am=" + amount +
    "&cu=INR";

  window.location.href = upiLink;
};
</script>

</body>
</html>
